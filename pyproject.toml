[project]
name = "bareum-ai"
version = "0.1.0"
description = "바름 AI 처리 서비스"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bareum_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
