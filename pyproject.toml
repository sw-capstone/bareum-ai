[project]
name = "bareum-ai"
version = "0.1.0"
description = "바름 AI 처리 서비스"
requires-python = ">=3.14,<3.15"
dependencies = [
    "anyio>=4,<5",
    "fastapi>=0.115",
    "httpx2[http2,brotli,zstd]>=2.13.1,<3",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2,<3",
    "pymupdf==1.28.2",
    "pyyaml>=6",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dataset = []
dev = [
    "pytest>=8",
]

[tool.uv]
default-groups = ["dev", "dataset"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bareum_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # PyMuPDF(SWIG) 내부 경고. Python 3.14에서 발생하며 파서 동작과 무관하다.
    "ignore:builtin type (SwigPyPacked|SwigPyObject|swigvarlink) has no __module__ attribute:DeprecationWarning",
]
