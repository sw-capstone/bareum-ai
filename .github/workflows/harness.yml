name: Harness

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: ./scripts/run-harness.sh check
      - run: ./scripts/test-harness.sh
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: ./scripts/test-app.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-report
          path: harness/reports/report.json
