name: CI

on:
  pull_request:
    branches: [develop]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Bareum AI CI
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate workflow and shell syntax
        run: bash .github/scripts/check-ci.sh
      - name: Test SSM deployment requests
        run: bash .github/tests/deploy-via-ssm-test.sh
      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.32"
          python-version: "3.14"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Test AI application
        run: uv run --no-sync python -m pytest
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build ARM64 image without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          tags: bareum-ai:pr-smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test image startup
        env:
          SMOKE_IMAGE: bareum-ai:pr-smoke
        run: bash .github/scripts/smoke-image.sh
